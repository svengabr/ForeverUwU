<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever UwU – Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame"></div>

<div class="copy" style="gap: 30px;">
  <img src="../logo.png" alt="" style="width: 150px; height: 150px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6));">
  <h1 style="font-size: 104px; color: var(--gold);">Forever UwU</h1>
  <p style="font-family: 'Friz', serif; font-size: 42px; color: #fff;">Every crit deserves an uwu.</p>
  <p>Plays a random anime uwu whenever you land a critical hit or heal. Never the same one twice in a row.</p>
  <p class="note">For World of Warcraft: Forever</p>
</div>
<div class="stage">
  <div style="position: relative; width: 900px; height: 800px;">
    <div class="plate" style="left: 240px; top: 560px;"><div class="name">Kobold Tunneler</div><div class="bar"><span style="width: 22%"></span></div></div>
    <div class="fct hit" style="left: 120px; top: 470px;">52</div>
    <div class="fct hit" style="left: 650px; top: 430px;">48</div>
    <div class="fct crit" style="left: 280px; top: 290px;">207</div>
    <div class="uwu" style="left: 380px; top: 130px;">uwu~<span class="heart"></span></div>
    <div class="uwu small" style="left: 80px; top: 230px;">uwu</div>
  </div>
</div>
</body>
</html>
