<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever UwU – Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
<style>
  /* In-game screenshots of the options window (shots/), fanned out */
  .shot {
    position: absolute; width: 600px; border-radius: 10px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<div class="frame"></div>
<div class="brand"><img src="../logo.png" alt="">Forever UwU</div>
<div class="copy">
  <span class="chip" style="color: var(--pink)">Options</span>
  <h1>Your uwu, your way</h1>
  <p>Volume, cooldowns and the big-hit threshold on one page. Under Sounds, hear every clip and untick the ones you don't like.</p>
  <p class="note">Type /uwu · /uwu sounds</p>
</div>
<div class="stage">
  <div style="position: relative; width: 960px; height: 940px;">
    <img class="shot" src="shots/options-general.jpg" alt="" style="left: 20px; top: 40px; transform: rotate(-3deg);">
    <img class="shot" src="shots/options-sounds.jpg" alt="" style="left: 340px; top: 120px; transform: rotate(2deg);">
  </div>
</div>
</body>
</html>
