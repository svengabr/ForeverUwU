<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forever UwU – Getting hit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=block">
<link rel="stylesheet" href="style.css">
</head>
<body class="hurt">
<div class="frame"></div>
<div class="brand"><img src="../logo.png" alt="">Forever UwU</div>
<div class="copy">
  <span class="chip" style="color: #ff7a6a">Getting hit</span>
  <h1>Crit you? Ara ara~</h1>
  <p>When a mob crits you, or one hit takes a big chunk of your health, you get an angry uwu, an ara ara or a startled kyaa instead.</p>
  <p class="note">Big hit = 25 % of your max health by default, adjustable</p>
</div>
<div class="stage">
  <div style="position: relative; width: 900px; height: 800px;">
    <div class="uwu hurt" style="left: 330px; top: 150px;">ara ara~</div>
    <div class="fct dmg" style="left: 470px; top: 310px;">-103</div>
    <div class="unit" style="left: 80px; top: 470px;">
      <div class="portrait"></div>
      <div class="bars">
        <div class="name">You</div>
        <div class="bar hp"><span style="width: 41%"></span><span class="lost" style="left: 41%; width: 27%"></span><div class="val">281 / 690</div></div>
        <div class="bar mp"><span style="width: 76%"></span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
